<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Algebra 1 Practice | Tolux AI Math Coach</title>
  <meta name="description" content="Practice Algebra 1 equations, inequalities, systems, radicals, exponents, and other skills with first-attempt scoring, targeted hints, worked explanations, and mastery review." />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="practice-page">
    <header class="practice-header">
      <a class="back-dashboard" href="/">← Dashboard</a>
      <div>
        <small id="practiceMeta">Algebra 1 Practice</small>
        <h1 id="practiceTitle">Preparing your practice session…</h1>
      </div>
    </header>

    <section class="practice-progress" aria-labelledby="practiceProgressLabel">
      <p id="practiceProgressLabel">Loading questions…</p>
      <div class="progress-track">
        <div id="practiceProgressBar" class="progress-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      </div>
    </section>

    <div class="practice-workspace">
      <section class="practice-card" aria-live="polite">
        <div id="practiceQuestionView">
          <div class="question-header">
            <span id="practiceQuestionNumber">Question</span>
            <span id="practiceDifficulty" class="difficulty-badge"></span>
          </div>
          <div id="practicePrompt" class="math-prompt practice-prompt"></div>

          <div id="practiceAnswerArea" class="practice-answer-area">
            <label for="practiceAnswer"><strong>Your answer</strong></label>
            <input id="practiceAnswer" type="text" autocomplete="off" inputmode="text" placeholder="Enter your answer" />
            <button id="checkPracticeAnswer" class="lesson-primary-button" type="button">Check Answer</button>
          </div>

          <div class="lesson-help practice-help">
            <button id="practiceStuckBtn" type="button">I’m Stuck</button>
            <button id="practiceExplainBtn" type="button">Explain Another Way</button>
          </div>

          <div id="practiceFeedback" class="practice-feedback"></div>
          <button id="nextPracticeQuestion" class="practice-next-button" type="button" hidden>Next Question →</button>
        </div>

        <div id="practiceSummary" class="practice-summary" hidden></div>
      </section>

      <aside class="practice-sidebar">
        <h2>Session</h2>
        <dl>
          <div><dt>Skill</dt><dd id="practiceSkill">—</dd></div>
          <div><dt>Difficulty</dt><dd id="practiceSessionDifficulty">—</dd></div>
          <div><dt>Questions</dt><dd id="practiceSessionCount">—</dd></div>
          <div><dt>First-try score</dt><dd id="practiceLiveScore">0 / 0</dd></div>
        </dl>
        <p>Your free trial measures active learning time. Paid subscribers have unlimited practice access.</p>
        <a class="practice-settings-link" href="/#practiceModePanel">Change practice settings</a>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/math-input-normalizer.js"></script>
  <script src="/math-symbol-toolbar.js"></script>
  <script type="module">
    const skill = new URLSearchParams(window.location.search).get("skill");
    if (skill === "A.10F") import("/a10f-practice.js");
    else if (skill === "A.11A") import("/a11a-practice.js");
    else if (skill === "A.11B") import("/a11b-practice.js");
    else import("/practice.js");
  </script>
</body>
</html>
