name: Physics Coach QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [physics-coach-integration]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Run test suite
        run: npm test
